services:
  - type: web
    name: calling-agent-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: calling-agent-db
          property: connectionString
      - key: VAPI_WEBHOOK_SECRET
        sync: false

databases:
  - name: calling-agent-db
    plan: free
